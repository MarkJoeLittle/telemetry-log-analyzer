name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        plotting: [false, true]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install optional plotting dependencies
        if: matrix.plotting
        run: python -m pip install -r requirements-plot.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run sample analysis
        run: python analyzer.py data/sample_telemetry.csv

  cross-repository-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out telemetry analyzer
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: telemetry-log-analyzer

      - name: Check out health monitor
        uses: actions/checkout@v7
        with:
          repository: MarkJoeLittle/rtos-system-health-monitor
          persist-credentials: false
          path: rtos-system-health-monitor

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build health monitor
        working-directory: rtos-system-health-monitor
        run: |
          cmake -S . -B build-wsl
          cmake --build build-wsl

      - name: Run cross-repository test
        working-directory: telemetry-log-analyzer
        env:
          RTOS_HEALTH_MONITOR_EXECUTABLE: ../rtos-system-health-monitor/build-wsl/rtos_health_monitor
        run: python -m unittest tests/test_health_monitor_integration.py -v